name: (Build) 도커 이미지 빌드 및 업로드

on:
  workflow_call:
    inputs:
      branch:
        description: "배포 대상 브랜치명을 전달해주세요."
        required: true
        type: string
      build-stage:
        description: "빌드 서버 환경에 따라 전달해주세요. (개발: dev|운영:prod)"
        required: true
        default: "dev"
        type: string
      container-name:
        description: "도커 컨테이너명을 전달해주세요."
        required: true
        type: string
      is-push-image:
        description: "도커 이미지 빌드만 할경우 false로 전달해주세요"
        type: boolean
        default: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>/<containerName>
  IMAGE_NAME: ${{ github.repository }}/${{ inputs.container-name }}

jobs:
  docker-image-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Convert to lowercase
        id: lowercase
        run: |
          echo "lowercase=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Checkout repository from ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # 도커 레지스트리 로그인 (push안할 경우 생략)
      - name: Log in to registry ${{ env.REGISTRY }}
        if: ${{ inputs.is-push-image == true }}
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        env:
          LOWERCASE_IMAGE_NAME: ${{ steps.lowercase.outputs.lowercase }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.LOWERCASE_IMAGE_NAME }}
          # 가장 최신 image 에 latest tag 달기
          # flavor: |
          #   latest=true
          # Git short commit, use git version tag
          # tags: |
          #   type=sha
          # 빌드 환경을 태그로 설정
          tags: |
            ${{ inputs.build-stage }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ inputs.is-push-image == true }}
          file: ./Dockerfile
          build-args: |
            BUILD_STAGE=${{ inputs.build-stage }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
